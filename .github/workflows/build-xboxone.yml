name: Xbox One builds

on:
  workflow_call:

jobs:
  build-xboxone:
    name: Build (Xbox One)
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache GDK
        id: cache-gdk
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\gdk-cache
          key: gdk-${{ runner.os }}-x64

      - name: Install or restore GDK
        shell: pwsh
        run: |
          $cacheRoot = Join-Path '${{ runner.temp }}' 'gdk-cache'
          $installRoots = @(
            "${env:ProgramFiles}\Microsoft GDK",
            "${env:ProgramFiles(x86)}\Microsoft GDK"
          )

          $gdkRoot = $installRoots |
            Where-Object { $_ -and (Test-Path $_) } |
            Select-Object -First 1

          if ("${{ steps.cache-gdk.outputs.cache-hit }}" -eq "true") {
            $cached = @(
              (Join-Path $cacheRoot 'Microsoft GDK'),
              (Join-Path $cacheRoot 'MicrosoftGDK'),
              $cacheRoot
            ) |
              Where-Object { $_ -and (Test-Path $_) } |
              Select-Object -First 1

            if (-not $cached) {
              throw "Cached GDK directory was not found in $cacheRoot."
            }

            if (-not $gdkRoot) {
              $gdkRoot = "${env:ProgramFiles}\Microsoft GDK"
            }

            if (Test-Path $gdkRoot) {
              Remove-Item $gdkRoot -Recurse -Force
            }

            Copy-Item $cached $gdkRoot -Recurse -Force
          }
          else {
            winget install Microsoft.Gaming.GDK `
              --accept-package-agreements `
              --accept-source-agreements `
              --silent

            $gdkRoot = $installRoots |
              Where-Object { $_ -and (Test-Path $_) } |
              Select-Object -First 1

            if (-not $gdkRoot) {
              throw "Microsoft GDK was not found under Program Files after installation."
            }

            New-Item -ItemType Directory -Force -Path $cacheRoot | Out-Null
            Copy-Item $gdkRoot (Join-Path $cacheRoot 'Microsoft GDK') -Recurse -Force
          }

          if (-not $gdkRoot) {
            throw "Microsoft GDK was not found under Program Files after restore."
          }

          "GDK=$gdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "GDKX=$gdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Checkout SDL3
        uses: actions/checkout@v7
        with:
          repository: libsdl-org/SDL
          ref: release-3.2.10
          path: vendor/SDL3

      - name: Configure SDL3
        shell: pwsh
        run: |
          cmake -S "$env:GITHUB_WORKSPACE/vendor/SDL3" `
            -B "$env:GITHUB_WORKSPACE/vendor/SDL3/build" `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DSDL_SHARED=OFF `
            -DSDL_STATIC=ON `
            -DSDL_TESTS=OFF `
            -DSDL_INSTALL=ON `
            -DSDL_GDK=ON `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE/vendor/SDL3/install"

      - name: Build SDL3
        shell: pwsh
        run: |
          cmake --build "$env:GITHUB_WORKSPACE/vendor/SDL3/build"

      - name: Install SDL3
        shell: pwsh
        run: |
          cmake --install "$env:GITHUB_WORKSPACE/vendor/SDL3/build"

      - name: Configure Butterscotch
        shell: pwsh
        run: |
          cmake -S "$env:GITHUB_WORKSPACE" `
            -B "$env:GITHUB_WORKSPACE/build" `
            -G Ninja `
            -DPLATFORM=xboxone `
            -DBACKEND=sdl3 `
            -DGDK="$env:GDK" `
            -DGDKX="$env:GDKX" `
            -DSDL3_DIR="$env:GITHUB_WORKSPACE/vendor/SDL3/install" `
            -DCMAKE_BUILD_TYPE=Release `
            -DWERROR=ON

      - name: Build Butterscotch
        shell: pwsh
        run: |
          cmake --build "$env:GITHUB_WORKSPACE/build"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: butterscotch-xboxone
          path: build/**/*