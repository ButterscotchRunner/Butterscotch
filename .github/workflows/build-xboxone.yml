name: Xbox One builds

on:
  workflow_call:

jobs:
  build-xboxone:
    name: Build (Xbox One)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install GDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # GitHub's Windows images may have App Installer/WinGet
          # installed without winget.exe being on PATH.
          $winget = Get-ChildItem `
            "$env:LOCALAPPDATA\Microsoft\WindowsApps\winget.exe", `
            "$env:ProgramFiles\WindowsApps\Microsoft.DesktopAppInstaller_*__8wekyb3d8bbwe\winget.exe" `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $winget) {
            Write-Host "winget.exe was not found."
            Write-Host "WindowsApps contents:"
            Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WindowsApps" `
              -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -like "*winget*" }

            throw "WinGet is not available on this GitHub Actions runner."
          }

          Write-Host "Using WinGet: $winget"

          & $winget install Microsoft.Gaming.GDK `
            --accept-package-agreements `
            --accept-source-agreements `
            --silent `
            --disable-interactivity

          if ($LASTEXITCODE -ne 0) {
            throw "GDK installation failed with exit code $LASTEXITCODE"
          }

      - name: Verify GDK
        shell: pwsh
        run: |
          $gdkPaths = @(
            "C:\Program Files (x86)\Microsoft GDK",
            "C:\Program Files\Microsoft GDK"
          )

          foreach ($path in $gdkPaths) {
            if (Test-Path $path) {
              Write-Host "GDK found at: $path"
              Get-ChildItem $path -Directory | Select-Object Name
            }
          }

          $makepkg = Get-ChildItem `
            "C:\Program Files (x86)\Microsoft GDK" `
            -Recurse `
            -Filter "makepkg.exe" `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName

          if ($makepkg) {
            Write-Host "makepkg.exe: $makepkg"
          }

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Checkout SDL3
        uses: actions/checkout@v7
        with:
          repository: libsdl-org/SDL
          ref: release-3.2.10
          path: vendor/SDL3

      - name: Configure SDL3
        shell: pwsh
        run: |
          cmake -S "$env:GITHUB_WORKSPACE/vendor/SDL3" `
            -B "$env:GITHUB_WORKSPACE/vendor/SDL3/build" `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DSDL_SHARED=OFF `
            -DSDL_STATIC=ON `
            -DSDL_TESTS=OFF `
            -DSDL_INSTALL=ON `
            -DSDL_GDK=ON `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE/vendor/SDL3/install"

      - name: Build SDL3
        shell: pwsh
        run: |
          cmake --build "$env:GITHUB_WORKSPACE/vendor/SDL3/build" --parallel

      - name: Install SDL3
        shell: pwsh
        run: |
          cmake --install "$env:GITHUB_WORKSPACE/vendor/SDL3/build"

      - name: Configure Butterscotch
        shell: pwsh
        run: |
          cmake -S "$env:GITHUB_WORKSPACE" `
            -B "$env:GITHUB_WORKSPACE/build" `
            -G Ninja `
            -DPLATFORM=xboxone `
            -DBACKEND=sdl3 `
            -DSDL3_DIR="$env:GITHUB_WORKSPACE/vendor/SDL3/install" `
            -DCMAKE_BUILD_TYPE=Release `
            -DWERROR=ON

      - name: Build Butterscotch
        shell: pwsh
        run: |
          cmake --build "$env:GITHUB_WORKSPACE/build" --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: butterscotch-xboxone
          path: build/**