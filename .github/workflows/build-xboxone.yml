name: Xbox One builds

on:
  workflow_call:

jobs:
  build-xboxone:
    name: Build (Xbox One)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install GDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $gdkInstaller = "$env:RUNNER_TEMP\gdk.exe"

          Write-Host "Downloading GDK..."
          Invoke-WebRequest `
            -Uri "https://aka.ms/gdkdl" `
            -OutFile $gdkInstaller

          Write-Host "Downloaded GDK installer:"
          Get-Item $gdkInstaller | Format-List FullName, Length

          Write-Host "Installing GDK..."
          $process = Start-Process `
            -FilePath $gdkInstaller `
            -ArgumentList "/quiet", "/norestart" `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            throw "GDK installer failed with exit code $($process.ExitCode)"
          }

          Write-Host "GDK installation completed."

      - name: Verify GDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $gdkPaths = @(
            "C:\Program Files (x86)\Microsoft GDK",
            "C:\Program Files\Microsoft GDK"
          )

          $gdkRoot = $null

          foreach ($path in $gdkPaths) {
            if (Test-Path $path) {
              Write-Host "GDK found at: $path"
              $gdkRoot = $path
              break
            }
          }

          if (-not $gdkRoot) {
            throw "Microsoft GDK was not found after installation."
          }

          Write-Host "GDK contents:"
          Get-ChildItem $gdkRoot

          $makepkg = Get-ChildItem `
            $gdkRoot `
            -Recurse `
            -Filter "makepkg.exe" `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $makepkg) {
            throw "makepkg.exe was not found in the GDK installation."
          }

          Write-Host "Found makepkg:"
          Write-Host $makepkg.FullName

          # Make GDK tools available to subsequent steps.
          Add-Content $env:GITHUB_PATH $makepkg.Directory.FullName

      - name: Check GDK tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "makepkg:"
          Get-Command makepkg.exe

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Checkout SDL3
        uses: actions/checkout@v7
        with:
          repository: libsdl-org/SDL
          ref: release-3.2.10
          path: vendor/SDL3

      - name: Configure SDL3
        shell: pwsh
        run: |
          cmake -S "$env:GITHUB_WORKSPACE/vendor/SDL3" `
            -B "$env:GITHUB_WORKSPACE/vendor/SDL3/build" `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DSDL_SHARED=OFF `
            -DSDL_STATIC=ON `
            -DSDL_TESTS=OFF `
            -DSDL_INSTALL=ON `
            -DSDL_GDK=ON `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE/vendor/SDL3/install"

      - name: Build SDL3
        shell: pwsh
        run: |
          cmake --build "$env:GITHUB_WORKSPACE/vendor/SDL3/build" --parallel

      - name: Install SDL3
        shell: pwsh
        run: |
          cmake --install "$env:GITHUB_WORKSPACE/vendor/SDL3/build"

      - name: Configure Butterscotch
        shell: pwsh
        run: |
          cmake -S "$env:GITHUB_WORKSPACE" `
            -B "$env:GITHUB_WORKSPACE/build" `
            -G Ninja `
            -DPLATFORM=xboxone `
            -DBACKEND=sdl3 `
            -DSDL3_DIR="$env:GITHUB_WORKSPACE/vendor/SDL3/install" `
            -DCMAKE_BUILD_TYPE=Release `
            -DWERROR=ON

      - name: Build Butterscotch
        shell: pwsh
        run: |
          cmake --build "$env:GITHUB_WORKSPACE/build" --parallel

      - name: Show build output
        shell: pwsh
        run: |
          Write-Host "Build directory:"
          Get-ChildItem "$env:GITHUB_WORKSPACE/build" -Recurse

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: butterscotch-xboxone
          path: build/**