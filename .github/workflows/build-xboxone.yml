name: Xbox One builds

on:
  workflow_call:

jobs:
  build-xboxone:
    name: Build (Xbox One)
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache GDK
        id: cache-gdk
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\gdk-cache
          key: gdk-${{ runner.os }}-x64

      - name: Install or restore GDK
        shell: pwsh
        run: |
          $cacheRoot = Join-Path '${{ runner.temp }}' 'gdk-cache'
          $installRoots = @(
            "${env:ProgramFiles}\Microsoft GDK",
            "${env:ProgramFiles(x86)}\Microsoft GDK"
          )

          $gdkRoot = $installRoots |
            Where-Object { $_ -and (Test-Path $_) } |
            Select-Object -First 1

          if ("${{ steps.cache-gdk.outputs.cache-hit }}" -eq "true") {
            $cached = @(
              (Join-Path $cacheRoot 'Microsoft GDK'),
              (Join-Path $cacheRoot 'MicrosoftGDK'),
              $cacheRoot
            ) |
              Where-Object { $_ -and (Test-Path $_) } |
              Select-Object -First 1

            if (-not $cached) {
              throw "Cached GDK directory was not found in $cacheRoot."
            }

            if (-not $gdkRoot) {
              $gdkRoot = "${env:ProgramFiles}\Microsoft GDK"
            }

            if (Test-Path $gdkRoot) {
              Remove-Item $gdkRoot -Recurse -Force
            }

            Copy-Item $cached $gdkRoot -Recurse -Force
          }
          else {
            winget install Microsoft.Gaming.GDK `
              --accept-package-agreements `
              --accept-source-agreements `
              --silent

            $gdkRoot = $installRoots |
              Where-Object { $_ -and (Test-Path $_) } |
              Select-Object -First 1

            if (-not $gdkRoot) {
              throw "Microsoft GDK was not found under Program Files after installation."
            }

            New-Item -ItemType Directory -Force -Path $cacheRoot | Out-Null
            Copy-Item $gdkRoot (Join-Path $cacheRoot 'Microsoft GDK') -Recurse -Force
          }

          if (-not $gdkRoot) {
            throw "Microsoft GDK was not found under Program Files after restore."
          }

          "GDK=$gdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "GDKX=$gdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache SDL2 build
        id: cache-sdl2
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/vendor/SDL2/install
          key: sdl2-xboxone-${{ runner.os }}-2.32.10-rev2

      - name: Checkout SDL2
        if: steps.cache-sdl2.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: libsdl-org/SDL
          ref: release-2.32.10
          path: vendor/SDL2

      - name: Build SDL2 from source
        if: steps.cache-sdl2.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          cmake -S "$env:GITHUB_WORKSPACE/vendor/SDL2" `
            -B "$env:GITHUB_WORKSPACE/vendor/SDL2/build" `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE/vendor/SDL2/install" `
            -DSDL_SHARED=OFF `
            -DSDL_STATIC=ON `
            -DSDL_TESTS=OFF `
            -DSDL_GDK=ON
          cmake --build "$env:GITHUB_WORKSPACE/vendor/SDL2/build"
          cmake --install "$env:GITHUB_WORKSPACE/vendor/SDL2/build"

      - name: Configure Butterscotch
        shell: pwsh
        run: |
          function Invoke-WithGdkPrompt {
            param([string]$Command)

            $gdkPrompt = @(
              "${env:ProgramFiles(x86)}\Microsoft GDK\Command Prompts\Desktop VS 2026 Gaming Command Prompt.lnk",
              "${env:ProgramFiles}\Microsoft GDK\Command Prompts\Desktop VS 2026 Gaming Command Prompt.lnk"
            ) |
              Where-Object { $_ -and (Test-Path $_) } |
              Select-Object -First 1

            if (-not $gdkPrompt) {
              throw 'Microsoft GDK Desktop VS 2026 Gaming Command Prompt.lnk was not found.'
            }

            $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($gdkPrompt)
            $target = $shortcut.TargetPath
            $args = $shortcut.Arguments

            if (-not $target) {
              throw 'The GDK command prompt shortcut target could not be resolved.'
            }

            $launcher = if ($args) { '"{0}" {1}' -f $target, $args } else { '"{0}"' -f $target }
            cmd.exe /d /c "$launcher && $Command"
          }

          if (Test-Path "$env:GITHUB_WORKSPACE/build") {
            Remove-Item "$env:GITHUB_WORKSPACE/build" -Recurse -Force
          }

          Invoke-WithGdkPrompt "cmake -S `"$env:GITHUB_WORKSPACE`" -B `"$env:GITHUB_WORKSPACE/build`" -G Ninja -DPLATFORM=xboxone -DBACKEND=sdl2 -DGDK=`"$env:GDK`" -DGDKX=`"$env:GDKX`" -DSDL2_DIR=`"$env:GITHUB_WORKSPACE/vendor/SDL2/install`" -DCMAKE_PREFIX_PATH=`"$env:GITHUB_WORKSPACE/vendor/SDL2/install`" -DCMAKE_BUILD_TYPE=Release -DWERROR=ON"

      - name: Build Butterscotch
        shell: pwsh
        run: |
          function Invoke-WithGdkPrompt {
            param([string]$Command)

            $gdkPrompt = @(
              "${env:ProgramFiles(x86)}\Microsoft GDK\Command Prompts\Desktop VS 2026 Gaming Command Prompt.lnk",
              "${env:ProgramFiles}\Microsoft GDK\Command Prompts\Desktop VS 2026 Gaming Command Prompt.lnk"
            ) |
              Where-Object { $_ -and (Test-Path $_) } |
              Select-Object -First 1

            if (-not $gdkPrompt) {
              throw 'Microsoft GDK Desktop VS 2026 Gaming Command Prompt.lnk was not found.'
            }

            $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($gdkPrompt)
            $target = $shortcut.TargetPath
            $args = $shortcut.Arguments

            if (-not $target) {
              throw 'The GDK command prompt shortcut target could not be resolved.'
            }

            $launcher = if ($args) { '"{0}" {1}' -f $target, $args } else { '"{0}"' -f $target }
            cmd.exe /d /c "$launcher && $Command"
          }

          Invoke-WithGdkPrompt 'cmake --build "${env:GITHUB_WORKSPACE}/build"'

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: butterscotch-xboxone
          path: build/**/*