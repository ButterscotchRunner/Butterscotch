name: Linux builds

on:
  workflow_call:

jobs:
  build-desktop-linux:
    name: Build (${{ matrix.desktop_backend }}/Linux ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            desktop_backend: GLFW3

          - arch: i686
            runner: ubuntu-24.04
            desktop_backend: SDL2
            cflags: "-m32"
            cxxflags: "-m32"
            ldflags: "-m32"

          - arch: arm64
            runner: ubuntu-24.04-arm64
            desktop_backend: GLFW3

    steps:
      - uses: actions/checkout@v4

      - name: Get commit info
        id: commit-info
        run: |
          echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(git log -1 --format=%cd --date=short)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            cmake \
            ninja-build \
            ccache \
            libbz2-dev \
            gcc-multilib \
            g++-multilib

          case "${{ matrix.desktop_backend }}" in
            GLFW3)
              sudo apt-get install -y libglfw3-dev
              ;;
            SDL2)
              sudo apt-get install -y libsdl2-dev
              ;;
          esac

      - name: Build 32-bit backend dependencies for i686
        if: ${{ matrix.arch == 'i686' }}
        env:
          CCACHE_DIR: ~/.cache/ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CC: ccache gcc
          CXX: ccache g++

        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update

          case "${{ matrix.desktop_backend }}" in
            GLFW3)
              sudo apt-get install -y \
                python3-pip meson ninja-build cmake \
                libx11-dev:i386 \
                libx11-xcb-dev:i386 \
                libxrandr-dev:i386 \
                libxcursor-dev:i386 \
                libxinerama-dev:i386 \
                libxss-dev:i386 \
                libxi-dev:i386 \
                libxau-dev:i386 \
                libxdmcp-dev:i386 \
                libgl1-mesa-dev:i386 \
                libglu1-mesa-dev:i386 \
                libxkbcommon-dev:i386 \
                libxcb1-dev:i386 \
                libxcb-xkb-dev:i386 \
                libxkbcommon-x11-dev:i386 \
                libffi-dev:i386 \
                libexpat1-dev:i386 \
                libxml2-dev:i386

              python3 -m pip install --user --upgrade "meson>=1.4.0"

              export WAYLAND32_PREFIX="/tmp/wayland32"
              export PKG_CONFIG_LIBDIR="/usr/lib/i386-linux-gnu/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig:${WAYLAND32_PREFIX}/lib/pkgconfig:${WAYLAND32_PREFIX}/lib/x86_64-linux-gnu/pkgconfig:${WAYLAND32_PREFIX}/share/pkgconfig"
              export PKG_CONFIG_PATH="/tmp/native-pkgconfig:${WAYLAND32_PREFIX}/lib/pkgconfig:${WAYLAND32_PREFIX}/lib/x86_64-linux-gnu/pkgconfig:${WAYLAND32_PREFIX}/share/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
              export PATH="${WAYLAND32_PREFIX}/bin:$HOME/.local/bin:$PATH"
              hash -r

              meson --version
              which wayland-scanner || true
              wayland-scanner --version || true

              mkdir -p /tmp/native-pkgconfig
              NATIVE_PC=$(pkg-config --variable pcfiledir wayland-scanner)/wayland-scanner.pc
              cp "$NATIVE_PC" /tmp/native-pkgconfig/

              git clone --depth 1 https://gitlab.freedesktop.org/wayland/wayland /tmp/wayland
              meson setup /tmp/wayland32-build /tmp/wayland \
                --prefix="$WAYLAND32_PREFIX" \
                -Dc_args=-m32 \
                -Dcpp_args=-m32 \
                -Dc_link_args=-m32 \
                -Dcpp_link_args=-m32 \
                -Ddocumentation=false
              ninja -C /tmp/wayland32-build
              ninja -C /tmp/wayland32-build install

              git clone --depth 1 \
                https://gitlab.freedesktop.org/wayland/wayland-protocols \
                /tmp/wayland-protocols
              meson setup /tmp/wayland-protocols/build \
                /tmp/wayland-protocols \
                --prefix="$WAYLAND32_PREFIX" \
                -Dtests=false
              ninja -C /tmp/wayland-protocols/build install

              git clone --depth 1 \
                https://github.com/xkbcommon/libxkbcommon \
                /tmp/xkbcommon
              meson setup /tmp/xkbcommon/build \
                /tmp/xkbcommon \
                --prefix="$WAYLAND32_PREFIX" \
                -Dc_args=-m32 \
                -Dcpp_args=-m32 \
                -Dc_link_args=-m32 \
                -Dcpp_link_args=-m32
              ninja -C /tmp/xkbcommon/build
              ninja -C /tmp/xkbcommon/build install

              git clone https://github.com/glfw/glfw.git /tmp/glfw
              git -C /tmp/glfw fetch --depth=1 origin \
                fdd14e65b1c29e4e6df875fb5669ec00d6793531
              git -C /tmp/glfw checkout FETCH_HEAD

              cmake -S /tmp/glfw -B /tmp/glfw/build -G Ninja \
                -DCMAKE_INSTALL_PREFIX=/tmp/glfw32 \
                -DGLFW_BUILD_SHARED_LIBS=OFF \
                -DGLFW_BUILD_EXAMPLES=OFF \
                -DGLFW_BUILD_TESTS=OFF \
                -DGLFW_BUILD_DOCS=OFF \
                -DGLFW_BUILD_WAYLAND=ON \
                -DGLFW_BUILD_X11=ON \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                -DCMAKE_C_FLAGS=-m32 \
                -DCMAKE_CXX_FLAGS=-m32 \
                -DCMAKE_EXE_LINKER_FLAGS=-m32
              ninja -C /tmp/glfw/build
              ninja -C /tmp/glfw/build install
              ;;
            SDL2)
              sudo apt-get install -y libsdl2-dev:i386
              ;;
          esac

      - uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ matrix.desktop_backend }}-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-${{ matrix.desktop_backend }}-${{ matrix.arch }}-

      - name: Configure
        env:
          CFLAGS: ${{ matrix.cflags }}
          CXXFLAGS: ${{ matrix.cxxflags }}
          LDFLAGS: ${{ matrix.ldflags }}
          PKG_CONFIG_PATH: ${{ matrix.arch == 'i686' && matrix.desktop_backend == 'GLFW3' && '/tmp/glfw32/lib/pkgconfig' || '' }}
        run: |
          cmake -B build -G Ninja \
            -DWERROR=ON \
            -DDESKTOP_BACKEND=${{ matrix.desktop_backend }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="gcc" \
            -DCMAKE_CXX_COMPILER="g++" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: butterscotch-${{ matrix.desktop_backend }}-linux-${{ matrix.arch }}
          path: build/butterscotch
