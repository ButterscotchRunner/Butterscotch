name: Linux builds

on:
  workflow_call:

jobs:
  build-desktop-linux:
    name: Build (${{ matrix.desktop_backend_label }}/Linux ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            desktop_backend: glfw3
            desktop_backend_label: GLFW3

          - arch: i686
            runner: ubuntu-22.04
            desktop_backend: sdl2
            desktop_backend_label: SDL2
            cflags: "-m32"
            cxxflags: "-m32"
            ldflags: "-m32"

          - arch: arm64
            runner: ubuntu-24.04-arm64
            desktop_backend: glfw3
            desktop_backend_label: GLFW3

    steps:
      - uses: actions/checkout@v4

      - name: Get commit info
        id: commit-info
        run: |
          echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(git log -1 --format=%cd --date=short)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            cmake \
            ninja-build \
            ccache \
            libbz2-dev \
            gcc-multilib \
            g++-multilib

          case "${{ matrix.desktop_backend }}" in
            glfw3)
              if [ "${{ matrix.arch }}" = "i686" ]; then
                sudo dpkg --add-architecture i386
                sudo apt-get install -y libglfw3-dev:i386
              else
                sudo apt-get install -y libglfw3-dev
              fi
              ;;
            sdl2)
              if [ "${{ matrix.arch }}" = "i686" ]; then
                sudo dpkg --add-architecture i386
                sudo apt-get install -y libsdl2-dev:i386
              else
                sudo apt-get install -y libsdl2-dev
              fi
              ;;
          esac

      - uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ matrix.desktop_backend }}-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-${{ matrix.desktop_backend }}-${{ matrix.arch }}-

      - name: Configure
        env:
          CFLAGS: ${{ matrix.cflags }}
          CXXFLAGS: ${{ matrix.cxxflags }}
          LDFLAGS: ${{ matrix.ldflags }}
          PKG_CONFIG_PATH: ${{ matrix.arch == 'i686' && matrix.desktop_backend == 'glfw3' && '/tmp/glfw32/lib/pkgconfig' || '' }}
        run: |
          cmake -B build -G Ninja \
            -DWERROR=ON \
            -DDESKTOP_BACKEND=${{ matrix.desktop_backend }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="gcc" \
            -DCMAKE_CXX_COMPILER="g++" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: butterscotch-${{ matrix.desktop_backend }}-linux-${{ matrix.arch }}
          path: build/butterscotch
