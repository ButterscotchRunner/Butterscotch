name: Linux builds

on:
  workflow_call:

jobs:
  build-desktop-linux:
    name: Build (${{ matrix.desktop_backend_label }}/Linux ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            desktop_backend: glfw3
            desktop_backend_label: GLFW3

          - arch: i686
            runner: ubuntu-22.04
            desktop_backend: sdl2
            desktop_backend_label: SDL2
            cflags: "-m32"
            cxxflags: "-m32"
            ldflags: "-m32"

          - arch: arm64
            runner: ubuntu-24.04
            desktop_backend: glfw3
            desktop_backend_label: GLFW3
            target_triple: aarch64-linux-gnu
            cflags: "-march=armv8-a"
            cxxflags: "-march=armv8-a"

    steps:
      - uses: actions/checkout@v4

      - name: Get commit info
        id: commit-info
        run: |
          echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(git log -1 --format=%cd --date=short)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          if [ "${{ matrix.desktop_backend }}" = "glfw3" ]; then
            pkg_name="libglfw3-dev"
          elif [ "${{ matrix.desktop_backend }}" = "sdl2" ]; then
            pkg_name="libsdl2-dev"
          else
            echo "Unknown desktop backend: ${{ matrix.desktop_backend }}"
            exit 1
          fi
          
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            sudo dpkg --add-architecture arm64
            sudo tee /etc/apt/sources.list.d/ubuntu-ports-arm64.sources >/dev/null <<'EOF'
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: noble noble-updates noble-security noble-backports
          Components: main universe restricted multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF

            sudo apt-get update
            sudo apt-get install -y \
              gcc-aarch64-linux-gnu \
              g++-aarch64-linux-gnu \
              libc6-dev-arm64-cross \
              libglfw3-dev:arm64
          elif [ "${{ matrix.arch }}" = "i686" ]; then
            sudo dpkg --add-architecture i386
            sudo apt-get update
            sudo apt-get install -y \
              gcc-multilib \
              g++-multilib \
              $pkg_name:i386
          else
            sudo apt-get update
            sudo apt-get install -y \
              gcc-multilib \
              g++-multilib \
              $pkg_name
          fi
          sudo apt-get install -y \
              pkg-config \
              cmake \
              ninja-build \
              ccache \
              libbz2-dev \

      - uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ matrix.desktop_backend }}-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-${{ matrix.desktop_backend }}-${{ matrix.arch }}-

      - name: Configure
        env:
          CFLAGS: ${{ matrix.cflags }}
          CXXFLAGS: ${{ matrix.cxxflags }}
          LDFLAGS: ${{ matrix.ldflags }}
        run: |
          export PKG_CONFIG_PATH=""
          export PKG_CONFIG_LIBDIR=""
          export PKG_CONFIG_SYSROOT_DIR=""

          if [ "${{ matrix.arch }}" = "arm64" ]; then
            export PKG_CONFIG_PATH="/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/lib/aarch64-linux-gnu:/usr/share/pkgconfig"
            export PKG_CONFIG_LIBDIR="$PKG_CONFIG_PATH"
            export PKG_CONFIG_SYSROOT_DIR="/"
          fi

          if [ "${{ matrix.arch }}" = "arm64" ]; then
            export CC="${{ matrix.target_triple }}-gcc"
            export CXX="${{ matrix.target_triple }}-g++"
          fi

          cmake -B build -G Ninja \
            -DWERROR=ON \
            -DDESKTOP_BACKEND=${{ matrix.desktop_backend }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER="${{ matrix.arch == 'arm64' && format('{0}-gcc', matrix.target_triple) || 'gcc' }}" \
            -DCMAKE_CXX_COMPILER="${{ matrix.arch == 'arm64' && format('{0}-g++', matrix.target_triple) || 'g++' }}" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_FIND_ROOT_PATH=/usr/${{ matrix.target_triple }} \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY

      - name: Build
        run: cmake --build build --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: butterscotch-${{ matrix.desktop_backend }}-linux-${{ matrix.arch }}
          path: build/butterscotch
