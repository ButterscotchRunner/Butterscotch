name: macOS builds

on:
  workflow_call:

jobs:
  build-appkit-macos-modern:
    name: Build (AppKit ${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x86_64
            runner: macos-26-intel
          - label: arm64
            runner: macos-26

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Get commit info
        id: commit-info
        run: |
          echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(git log -1 --format=%cd --date=short)" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: brew install ccache
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1

      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ccache
          key: ccache-macos-${{ matrix.label }}-${{ github.sha }}
          restore-keys: |
            ccache-macos-${{ matrix.label }}-

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DWERROR=ON \
            -DCMAKE_C_FLAGS="-Wno-deprecated-declarations" \
            -DBACKEND=appkit \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: butterscotch-appkit-macos-${{ matrix.label }}
          path: build/butterscotch

  build-appkit-macos-cross:
    name: Build (SDL 1.2 ${{ matrix.arch }})
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.docker || 'ubuntu:24.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: i386
            cc: o32-clang
            ar: i386-apple-darwin8-ar
            ranlib: i386-apple-darwin8-ranlib
            cflags: "-march=yonah"
            target_prefix: "${{ github.workspace }}/vendor/osxcross/target"
            sdk_path: "${{ github.workspace }}/vendor/osxcross/target/SDK/MacOSX10.4u.sdk"
            sdl_prefix: "${{ github.workspace }}/vendor/osxcross/target"
          
          - arch: powerpc
            docker: ghcr.io/variantxyz/gcc-powerpc-apple-darwin8:build-gcc-14.2-macosxsdk10.4u
            cc: powerpc-apple-darwin8-gcc
            ar: powerpc-apple-darwin8-ar
            ranlib: powerpc-apple-darwin8-ranlib
            cflags: "-march=G3"
            target_prefix: "/usr/local"
            sdk_path: "/usr/local/MacOSX10.4u.sdk"
            sdl_prefix: "${{ github.workspace }}/vendor/sdl_ppc"

    steps:
      - uses: actions/checkout@v4
      
      - name: Get commit info
        id: commit-info
        run: |
          echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Install dependencies (Host)
        if: matrix.arch == 'i386'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build ccache libxml2-dev uuid-dev libssl-dev bash patch make tar xz-utils bzip2 gzip cpio zlib1g-dev

      - name: Install build tools (Container)
        if: matrix.arch == 'powerpc'
        run: |
          apt-get update && apt-get install -y cmake ninja-build ccache || true

      - name: Cache Intel OSXCross and ccache
        if: matrix.arch == 'i386'
        id: cache-intel
        uses: actions/cache@v6
        with:
          path: |
              vendor/osxcross
              ~/.cache/ccache
          key: osxcross-${{ matrix.arch }}-v1

      - name: Cache PowerPC SDL and ccache
        if: matrix.arch == 'powerpc'
        id: cache-ppc
        uses: actions/cache@v6
        with:
          path: |
              ${{ github.workspace }}/vendor/sdl_ppc
              ~/.cache/ccache
          key: sdl-ppc-${{ matrix.arch }}-v1

      - name: Checkout OSXCross
        if: matrix.arch == 'i386' && steps.cache-intel.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: tpoechtrager/osxcross
          ref: osxcross-1.1
          path: vendor/osxcross

      - name: Download Mac OS X SDK
        if: matrix.arch == 'i386' && steps.cache-intel.outputs.cache-hit != 'true'
        run: |
          curl -L -o vendor/osxcross/tarballs/MacOSX10.4u.sdk.tar.xz https://github.com

      - name: Build OSXCross toolchain
        if: matrix.arch == 'i386' && steps.cache-intel.outputs.cache-hit != 'true'
        env:
          UNATTENDED: "1"
        run: |
          cd vendor/osxcross
          ./build.sh

      - name: Checkout SDL 1.2
        if: |
          (matrix.arch == 'i386' && steps.cache-intel.outputs.cache-hit != 'true') ||
          (matrix.arch == 'powerpc' && steps.cache-ppc.outputs.cache-hit != 'true')
        uses: actions/checkout@v7
        with:
          repository: libsdl-org/SDL-1.2
          ref: a1f09d7b03a0e1c49f7c91b521fce3cccd6fff6e
          path: vendor/SDL

      - name: Build SDL 1.2
        if: |
          (matrix.arch == 'i386' && steps.cache-intel.outputs.cache-hit != 'true') ||
          (matrix.arch == 'powerpc' && steps.cache-ppc.outputs.cache-hit != 'true')
        env:
          CC: ${{ matrix.cc }}
          CFLAGS: "${{ matrix.cflags }}"
        run: |
          export PATH="${{ matrix.target_prefix }}/bin:$PATH"
          cd vendor/SDL
          ./configure \
            --host=${{ matrix.arch }}-apple-darwin8 \
            --prefix=${{ matrix.sdl_prefix }} \
            --disable-shared || cat config.log
          make -j$(nproc)
          make install

      - name: Configure and build Butterscotch
        env:
          CC: ${{ matrix.cc }}
        run: |
          export PATH="${{ matrix.target_prefix }}/bin:$PATH"
          SDK_FRAMEWORKS="${{ matrix.sdk_path }}/System/Library/Frameworks"
          SDK_USR_LIB="${{ matrix.sdk_path }}/usr/lib"
          ACC_REMAP="/System/Library/Frameworks/Accelerate.framework/Versions/A/Accelerate:${SDK_FRAMEWORKS}/vecLib.framework/Versions/A/vecLib"

          cmake -B build -G Ninja \
            -DWERROR=ON \
            -DBACKEND=sdl1 \
            -DAUDIO_BACKEND=openal \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SKIP_RPATH=ON \
            -DCMAKE_C_COMPILER="${{ matrix.cc }}" \
            -DCMAKE_AR="${{ matrix.ar }}" \
            -DCMAKE_RANLIB="${{ matrix.ranlib }}" \
            -DCMAKE_C_FLAGS="${{ matrix.cflags }} -Wno-deprecated-declarations -I${{ matrix.sdl_prefix }}/include" \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,-framework,Cocoa -Wl,-framework,Carbon -Wl,-framework,IOKit -Wl,-framework,AudioToolbox -Wl,-framework,CoreAudio -Wl,-framework,CoreServices -Wl,-framework,OpenGL -Xlinker -dylib_file -Xlinker ${ACC_REMAP} ${SDK_USR_LIB}/libobjc.A.dylib ${SDK_USR_LIB}/libgcc_s.1.dylib -Wl,-undefined,dynamic_lookup" \
            -DCMAKE_PREFIX_PATH="${{ matrix.sdl_prefix }};${{ matrix.target_prefix }}" \
            -DCMAKE_FIND_ROOT_PATH="${{ matrix.sdl_prefix }};${{ matrix.target_prefix }}" \
            -DCMAKE_INCLUDE_PATH="${{ matrix.sdl_prefix }}/include" \
            -DOPENAL_LIBRARY="${SDK_FRAMEWORKS}/OpenAL.framework/OpenAL" \
            -DOPENAL_INCLUDE_DIR="${SDK_FRAMEWORKS}/OpenAL.framework/Headers" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: butterscotch-sdl-macos-${{ matrix.arch }}
          path: build/butterscotch