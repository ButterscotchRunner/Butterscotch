name: macOS builds

on:
  workflow_call:

jobs:
  build-appkit-macos-modern:
    name: Build (AppKit ${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x86_64
            runner: macos-26-intel
          - label: arm64
            runner: macos-26

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Get commit info
        id: commit-info
        run: |
          echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(git log -1 --format=%cd --date=short)" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: brew install ccache
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1

      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ccache
          key: ccache-macos-${{ matrix.label }}-${{ github.sha }}
          restore-keys: |
            ccache-macos-${{ matrix.label }}-

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DWERROR=ON \
            -DCMAKE_C_FLAGS="-Wno-deprecated-declarations" \
            -DBACKEND=appkit \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: butterscotch-appkit-macos-${{ matrix.label }}
          path: build/butterscotch

  build-appkit-macos-cross:
      name: Build (SDL 1.2 ${{ matrix.arch }})
      strategy:
        fail-fast: false
        matrix:
          include:
            - arch: i386
              cflags: "-march=yonah"
            - arch: powerpc
              cflags: ""
  
      runs-on: ubuntu-24.04
      steps:
        - uses: actions/checkout@v4
  
        - name: Get commit info
          id: commit-info
          run: |
            echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
  
        - name: Install dependencies
          run: |
            sudo apt-get update
            sudo apt-get install -y clang cmake ninja-build ccache libxml2-dev uuid-dev libssl-dev bash patch make tar xz-utils bzip2 gzip cpio zlib1g-dev
  
        - name: Cache OSXCross toolchain
          id: cache-osxcross
          uses: actions/cache@v6
          with:
            path: vendor/osxcross
            key: osxcross-${{ matrix.arch }}-v1
  
        - name: Checkout OSXCross
          if: steps.cache-osxcross.outputs.cache-hit != 'true'
          uses: actions/checkout@v7
          with:
            repository: tpoechtrager/osxcross
            ref: osxcross-1.1
            path: vendor/osxcross

        - name: Download Mac OS X SDK
          if: steps.cache-osxcross.outputs.cache-hit != 'true'
          run: |
            curl -L -o vendor/osxcross/tarballs/MacOSX10.4u.sdk.tar.xz https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX10.4u.sdk.tar.xz
  
        - name: Build OSXCross toolchain
          if: steps.cache-osxcross.outputs.cache-hit != 'true'
          env:
            UNATTENDED: "1"
          run: |
            cd vendor/osxcross
            ./build.sh

        - name: Checkout SDL 1.2
          if: steps.cache-osxcross.outputs.cache-hit != 'true'
          uses: actions/checkout@v7
          with:
            repository: libsdl-org/SDL-1.2
            ref: a1f09d7b03a0e1c49f7c91b521fce3cccd6fff6e
            path: vendor/SDL

        - name: Build SDL 1.2
          if: steps.cache-osxcross.outputs.cache-hit != 'true'
          run: |
            cd vendor/SDL
            ./configure \
              --host=${{ matrix.arch }}-apple-darwin8 \
              --prefix=${{ github.workspace }}/vendor/osxcross/target \
              --disable-shared
            make -j$(nproc)
            make install

        - name: Configure and build Butterscotch
          env:
            CC: ${{ matrix.arch }}-apple-darwin8-clang
            CFLAGS: ${{ matrix.cflags }}
          run: |
            export PATH="${{ github.workspace }}/vendor/osxcross/target/bin:$PATH"
            cmake -B build -G Ninja \
              -DWERROR=ON \
              -DCMAKE_C_FLAGS="-Wno-deprecated-declarations" \
              -DBACKEND=sdl1 \
              -DCMAKE_PREFIX_PATH="${{ github.workspace }}/vendor/osxcross/target" \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build build

        - name: Upload artifact
          uses: actions/upload-artifact@v7
          with:
            name: butterscotch-sdl-macos-${{ matrix.arch }}
            path: build/butterscotch