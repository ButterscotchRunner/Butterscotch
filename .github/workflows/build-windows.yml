name: Windows builds

on:
  workflow_call:

jobs:
  build-arm-windows:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-w64-windows-gnu
            triplet: aarch64-w64-mingw32
            version: 20260826
            crt: ucrt
          - arch: armv7
            target: armv7-w64-windows-gnu
            triplet: armv7-w64-mingw32
            version: 20260826
            crt: ucrt

    steps:
      - uses: actions/checkout@v7

      - name: Get commit info
        id: commit-info
        run: |
          echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(git log -1 --format=%cd --date=short)" >> $GITHUB_OUTPUT

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            ccache \
            llvm

      - name: Setup ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-arm-windows-${{ matrix.arch }}-${{ matrix.version }}-${{ matrix.crt }}-${{ github.sha }}
          restore-keys: |
            ccache-arm-windows-${{ matrix.arch }}-${{ matrix.version }}-${{ matrix.crt }}-

      - name: Install LLVM-MinGW
        run: |
          curl -L \
            https://github.com/mstorsjo/llvm-mingw/releases/download/${{ matrix.version }}/llvm-mingw-${{ matrix.version }}-${{ matrix.crt }}-ubuntu-22.04-x86_64.tar.xz \
            -o /tmp/llvm-mingw.tar.xz

          sudo mkdir -p /opt/llvm-mingw
          sudo tar -xf /tmp/llvm-mingw.tar.xz \
            --strip-components=1 \
            -C /opt/llvm-mingw

          echo "/opt/llvm-mingw/bin" >> "$GITHUB_PATH"

      - name: Cache SDL2
        id: cache-sdl2
        uses: actions/cache@v6
        with:
          path: /usr/${{ matrix.triplet }}/sdl2
          key: sdl2-windows-${{ matrix.triplet }}-${{ matrix.version }}-${{ matrix.crt }}-${{ github.sha }}-2.32.10-rev1

      - name: Checkout SDL2
        if: steps.cache-sdl2.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: libsdl-org/SDL
          ref: release-2.32.10
          path: vendor/sdl2

      - name: Build SDL2 for MinGW
        if: steps.cache-sdl2.outputs.cache-hit != 'true'
        run: |
          cmake -B vendor/sdl2/build -S vendor/sdl2 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/cmake/llvm-mingw.cmake \
            -DTARGET_TRIPLE=${{ matrix.target }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_INSTALL_PREFIX=/usr/${{ matrix.triplet }}/sdl2 \
            -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TESTS=OFF

          cmake --build vendor/sdl2/build
          sudo cmake --install vendor/sdl2/build

      - name: Configure
        env:
          PKG_CONFIG_PATH: /usr/${{ matrix.triplet }}/sdl2/lib/pkgconfig
          PKG_CONFIG_LIBDIR: /usr/${{ matrix.triplet }}/sdl2/lib/pkgconfig
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/cmake/llvm-mingw.cmake \
            -DCMAKE_FIND_ROOT_PATH=/usr/${{ matrix.triplet }} \
            -DTARGET_TRIPLE=${{ matrix.target }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DWERROR=ON \
            -DBACKEND=sdl2 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON

      - name: Build
        run: |
          cmake --build build
          llvm-strip --strip-all build/butterscotch.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: butterscotch-sdl2-windows-${{ matrix.arch }}
          path: build/butterscotch.exe

  build-windows:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-w64-windows-gnu
            triplet: x86_64-w64-mingw32
            backend: sdl2
          - arch: i486
            target: i486-w64-windows-gnu
            triplet: i486-w64-mingw32
            backend: sdl1
    steps:
      - uses: actions/checkout@v7

      - name: Setup cache
        uses: actions/cache@v6
        with:
          path: |
              ~/.cache/ccache
              artifacts/windows/build/toolchain-${{ matrix.arch }}
          key: win32-artifact-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: win32-artifact-${{ matrix.arch }}-

      - name: Install MinGW and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache libgmp-dev libmpfr-dev libmpc-dev llvm ninja-build
          ARCH=${{ matrix.arch }} ./artifacts/windows/build-toolchain.sh

      - name: Build
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/artifacts/windows/build/toolchain-${{ matrix.arch }}/lib/pkgconfig
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/artifacts/windows/build/toolchain-${{ matrix.arch }}/lib/pkgconfig
        run: |
          cmake -S . -B build -G Ninja \
            -DBACKEND=${{ matrix.backend }} \
            -DWERROR=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_TARGET="${{ matrix.target }}" \
            -DCMAKE_CXX_COMPILER_TARGET="${{ matrix.target }}" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_SYSROOT=${{ github.workspace }}/artifacts/windows/build/toolchain-${{ matrix.arch }} \
            -DCMAKE_FIND_ROOT_PATH=${{ github.workspace }}/artifacts/windows/build/toolchain-${{ matrix.arch }} \
            -DCMAKE_C_COMPILER="clang" \
            -DCMAKE_CXX_COMPILER="clang++"
          cmake --build build
          llvm-strip --strip-all build/butterscotch.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: butterscotch-windows-${{ matrix.arch }}
          path: build/butterscotch.exe
