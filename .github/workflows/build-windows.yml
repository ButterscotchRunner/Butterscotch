name: Windows builds

on:
  workflow_call:

jobs:
  build-arm-windows:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-w64-windows-gnu
            triplet: aarch64-w64-mingw32
          - arch: armv7
            target: armv7-w64-windows-gnu
            triplet: armv7-w64-mingw32

    steps:
      - uses: actions/checkout@v7

      - name: Get commit info
        id: commit-info
        run: |
          echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(git log -1 --format=%cd --date=short)" >> $GITHUB_OUTPUT

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            ccache \
            llvm

      - name: Setup ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-arm-windows-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-arm-windows-${{ matrix.arch }}-

      - name: Install LLVM-MinGW
        run: |
          curl -L \
            https://github.com/mstorsjo/llvm-mingw/releases/download/20260826/llvm-mingw-20260826-ucrt-ubuntu-22.04-x86_64.tar.xz \
            -o /tmp/llvm-mingw.tar.xz

          sudo mkdir -p /opt/llvm-mingw
          sudo tar -xf /tmp/llvm-mingw.tar.xz \
            --strip-components=1 \
            -C /opt/llvm-mingw

          echo "/opt/llvm-mingw/bin" >> "$GITHUB_PATH"

      - name: Cache SDL2
        id: cache-sdl2
        uses: actions/cache@v6
        with:
          path: /usr/${{ matrix.triplet }}/sdl2
          key: sdl2-windows-${{ matrix.triplet }}-${{ github.sha }}-2.32.10-rev2

      - name: Checkout SDL2
        if: steps.cache-sdl2.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: libsdl-org/SDL
          ref: release-2.32.10
          path: vendor/sdl2

      - name: Build SDL2 for MinGW
        if: steps.cache-sdl2.outputs.cache-hit != 'true'
        run: |
          cmake -B vendor/sdl2/build -S vendor/sdl2 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/cmake/llvm-mingw.cmake \
            -DTARGET_TRIPLE=${{ matrix.target }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_INSTALL_PREFIX=/usr/${{ matrix.triplet }}/sdl2 \
            -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TESTS=OFF

          cmake --build vendor/sdl2/build
          sudo cmake --install vendor/sdl2/build

      - name: Configure
        env:
          PKG_CONFIG_PATH: /usr/${{ matrix.triplet }}/sdl2/lib/pkgconfig
          PKG_CONFIG_LIBDIR: /usr/${{ matrix.triplet }}/sdl2/lib/pkgconfig
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/cmake/llvm-mingw.cmake \
            -DCMAKE_FIND_ROOT_PATH=/usr/${{ matrix.triplet }} \
            -DTARGET_TRIPLE=${{ matrix.target }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DWERROR=ON \
            -DBACKEND=sdl2 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON

      - name: Build
        run: |
          cmake --build build
          llvm-strip --strip-all build/butterscotch.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: butterscotch-sdl2-windows-${{ matrix.arch }}
          path: build/butterscotch.exe

  build-windows:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            backend: sdl2
            libs: SDL2_LIBS='-lmingw32 -lSDL2main -lSDL2 -lm -ldinput8 -ldxguid -ldxerr8 -luser32 -lgdi32 -lwinmm -limm32 -lole32 -loleaut32 -lshell32 -lsetupapi -lversion -luuid'
          - arch: i486
            backend: sdl1
            libs: SDL1_LIBS='-lmingw32 -lSDLmain -lSDL -lm -luser32 -lgdi32 -lwinmm -ldxguid'
    steps:
      - uses: actions/checkout@v7

      - name: Setup cache
        uses: actions/cache@v6
        with:
          path: |
              ~/.cache/ccache
              artifacts/windows/build/toolchain-${{ matrix.arch }}
          key: win32-artifact-${{ github.sha }}
          restore-keys: win32-artifact-

      - name: Install MinGW and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache libgmp-dev libmpfr-dev libmpc-dev llvm
          ARCH=${{ matrix.arch }} ./artifacts/windows/build-toolchain.sh

      - name: Build
        run: |
          PATH="$PWD/artifacts/windows/build/toolchain-${{ matrix.arch }}/bin:$PATH" make \
              NO_COLOR=1 \
              VERBOSE=1 \
              CC='ccache ${{ matrix.arch }}-w64-mingw32-gcc' \
              CFLAGS='-O3 -DNDEBUG -flto -ffast-math -fno-finite-math-only -fomit-frame-pointer' \
              BACKEND=${{ matrix.backend }} \
              EXTRALIBS='-latomic' \
              ${{ matrix.libs }}
          llvm-strip --strip-all build/butterscotch.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: butterscotch-windows-${{ matrix.arch }}
          path: build/butterscotch.exe


  build-x64-gdk:
    name: Build (x64 GDK)
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache GDK
        id: cache-gdk
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\gdk-cache
          key: gdk-${{ runner.os }}-x64

      - name: Install or restore GDK
        shell: pwsh
        run: |
          $cacheRoot = Join-Path '${{ runner.temp }}' 'gdk-cache'
          $installRoots = @(
            "${env:ProgramFiles}\Microsoft GDK",
            "${env:ProgramFiles(x86)}\Microsoft GDK"
          )

          $gdkRoot = $installRoots |
            Where-Object { $_ -and (Test-Path $_) } |
            Select-Object -First 1

          if ("${{ steps.cache-gdk.outputs.cache-hit }}" -eq "true") {
            $cached = @(
              (Join-Path $cacheRoot 'Microsoft GDK'),
              (Join-Path $cacheRoot 'MicrosoftGDK'),
              $cacheRoot
            ) |
              Where-Object { $_ -and (Test-Path $_) } |
              Select-Object -First 1

            if (-not $cached) {
              throw "Cached GDK directory was not found in $cacheRoot."
            }

            if (-not $gdkRoot) {
              $gdkRoot = "${env:ProgramFiles}\Microsoft GDK"
            }

            if (Test-Path $gdkRoot) {
              Remove-Item $gdkRoot -Recurse -Force
            }

            Copy-Item $cached $gdkRoot -Recurse -Force
          }
          else {
            winget install Microsoft.Gaming.GDK `
              --accept-package-agreements `
              --accept-source-agreements `
              --silent

            $gdkRoot = $installRoots |
              Where-Object { $_ -and (Test-Path $_) } |
              Select-Object -First 1

            if (-not $gdkRoot) {
              throw "Microsoft GDK was not found under Program Files after installation."
            }

            New-Item -ItemType Directory -Force -Path $cacheRoot | Out-Null
            Copy-Item $gdkRoot (Join-Path $cacheRoot 'Microsoft GDK') -Recurse -Force
          }

          if (-not $gdkRoot) {
            throw "Microsoft GDK was not found under Program Files after restore."
          }

          "GDK=$gdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "GDKX=$gdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Cache SDL2 build
        id: cache-sdl2
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/vendor/SDL2/install
          key: sdl2-gdk-${{ runner.os }}-2.32.10-rev2

      - name: Checkout SDL2
        if: steps.cache-sdl2.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: libsdl-org/SDL
          ref: release-2.32.10
          path: vendor/SDL2

      - name: Build SDL2 from source
        if: steps.cache-sdl2.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          $gdkScript = Join-Path $workspace 'scripts\invoke-gdk.ps1'
          $sdlSrc = Join-Path $workspace 'vendor\SDL2'
          $sdlBuild = Join-Path $sdlSrc 'build'
          $sdlInstall = Join-Path $workspace 'vendor\SDL2\install'
          $cmakeCommand = "cmake -S `"$sdlSrc`" -B `"$sdlBuild`" -G `"Visual Studio 18 2026`" -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=`"$sdlInstall`" -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TESTS=OFF -DSDL_GDK=ON"
          & $gdkScript $cmakeCommand
          & $gdkScript "cmake --build `"$sdlBuild`" --config Release"
          & $gdkScript "cmake --install `"$sdlBuild`""

      - name: Configure Butterscotch
        shell: pwsh
        run: |
          if (Test-Path "$env:GITHUB_WORKSPACE/build") {
            Remove-Item "$env:GITHUB_WORKSPACE/build" -Recurse -Force
          }

          $workspace = $env:GITHUB_WORKSPACE
          $gdkScript = Join-Path $workspace 'scripts\invoke-gdk.ps1'
          $buildDir = Join-Path $workspace 'build'
          $sdlDir = Join-Path $workspace 'vendor\SDL2\install'
          $cmakeCommand = "cmake -S `"$workspace`" -B `"$buildDir`" -G `"Visual Studio 18 2026`" -A x64 -DBACKEND=sdl2 -DIS_GDK=ON -DSDL2_DIR=`"$sdlDir`" -DCMAKE_PREFIX_PATH=`"$sdlDir`" -DCMAKE_BUILD_TYPE=Release -DWERROR=ON"
          & $gdkScript $cmakeCommand

      - name: Build Butterscotch
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          $gdkScript = Join-Path $workspace 'scripts\invoke-gdk.ps1'
          $buildDir = Join-Path $workspace 'build'
          & $gdkScript "cmake --build `"$buildDir`" --config Release"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: butterscotch-gdk
          path: build/**/*