name: Other platform builds

on:
  workflow_call:

jobs:
  build-web:
    name: Build (Web)${{ matrix.label }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ""
            platform: web
            artifact: butterscotch-web
            output_glob: build/butterscotch.*
    steps:
      - uses: actions/checkout@v7

      - name: Get commit info
        id: commit-info
        run: |
          echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(git log -1 --format=%cd --date=short)" >> $GITHUB_OUTPUT

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install -y ccache

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-web-${{ matrix.platform }}-${{ github.sha }}
          restore-keys: |
            ccache-web-${{ matrix.platform }}-

      - name: Configure
        run: emcmake cmake -B build -G Ninja -DWERROR=ON -DPLATFORM=${{ matrix.platform }} -DBACKEND=web -DCMAKE_BUILD_TYPE=Release -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output_glob }}

  build-android:
    name: Build (Android)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
          cache-dependency-path: src/android/frontend/gradle/wrapper/gradle-wrapper.properties

      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install -y ccache

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-android-${{ github.sha }}
          restore-keys: |
            ccache-android-

      - name: Build APK
        run: |
          cd src/android/frontend
          ./gradlew assembleDebug  \
            -Pandroid.cxx.ndk.ccache=true \
            -Porg.gradle.caching=true

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: butterscotch-android
          path: src/android/frontend/app/build/outputs/apk/debug/app-debug.apk

  build-symbian:
    name: Build (Symbian)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache/restore@v5
        name: Check SDK
        id: cache_sdk
        with:
          path: symbiansdk.zip
          key: symbian-sdk

      - name: Download SDK
        if: steps.cache_sdk.outputs.cache-hit != 'true'
        run: Invoke-WebRequest https://nnproject.cc/dl/symbian3_gcce_1520_workflow.zip -OutFile symbiansdk.zip

      - name: Cache SDK
        if: steps.cache_sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: symbiansdk.zip
          key: symbian-sdk

      - name: Extract SDK
        run: Expand-Archive symbiansdk.zip -DestinationPath .

      - name: Compile
        run: |
          $SDK = "$pwd/SDK/"
          $Env:EPOCROOT = "$SDK".Substring(2)
          $Env:SBS_GCCE1520BIN = "$pwd/GCCE/bin"
          cmd /c "$SDK/epoc32/tools/sbs\bin\sbs.bat -b artifacts/symbian/bld.inf -c armv6_urel_gcce -f - -m $SDK/epoc32/build/Butterscotch/makefile -j 4"
          
          cd artifacts/symbian
          (Get-Content Butterscotch.pkg).Replace('$(EPOCROOT)', "$SDK").Replace('$(PLATFORM)', 'armv6').Replace('$(TARGET)', 'urel') | Set-Content Butterscotch.pkg
          cmd /c "$SDK/epoc32/tools/makesis.exe Butterscotch.pkg Butterscotch.sis"
          
          
      - name: Upload SIS
        uses: actions/upload-artifact@v7
        with:
          name: butterscotch-symbian
          path: artifacts/symbian/Butterscotch.sis
