name: Other platform builds

on:
  workflow_call:

jobs:
  build-web:
    name: Build (Web)${{ matrix.label }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ""
            platform: web
            artifact: butterscotch-web
            output_glob: build/butterscotch.*
          - label: " [Meta]"
            platform: web-meta
            artifact: butterscotch-web-meta
            output_glob: build/butterscotch-meta.*
    steps:
      - uses: actions/checkout@v7

      - name: Get commit info
        id: commit-info
        run: |
          echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(git log -1 --format=%cd --date=short)" >> $GITHUB_OUTPUT

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install -y ccache

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-web-${{ matrix.platform }}-${{ github.sha }}
          restore-keys: |
            ccache-web-${{ matrix.platform }}-

      - name: Configure
        run: emcmake cmake -B build -G Ninja -DWERROR=ON -DPLATFORM=${{ matrix.platform }} -DCMAKE_BUILD_TYPE=Release -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output_glob }}

  build-android:
    name: Build (Android)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
          cache-dependency-path: src/android/frontend/gradle/wrapper/gradle-wrapper.properties

      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install -y ccache

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-android-${{ github.sha }}
          restore-keys: |
            ccache-android-

      - name: Build APK
        run: |
          cd src/android/frontend
          ./gradlew assembleDebug  \
            -Pandroid.cxx.ndk.ccache=true \
            -Porg.gradle.caching=true

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: butterscotch-android
          path: src/android/frontend/app/build/outputs/apk/debug/app-debug.apk

  build-morphos:
    name: Build (MorphOS)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build deps and MorphOS SDK
        run: |
          sudo apt-get update && sudo apt-get install -y ccache lhasa
          curl -L -O https://bigfoot.morphos-team.net/test/morphos-sdk_20230510-1_amd64.deb
          sudo apt-get install -y ./morphos-sdk_20230510-1_amd64.deb

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-morphos-${{ github.sha }}
          restore-keys: |
            ccache-morphos-

      - name: Fetch SDL2 and OpenAL
        run: |
          curl -L -o SDL2.lha https://www.morphos-storage.net/dl.php?id=2450563
          sudo lhasa -xw=/opt SDL2.lha
          curl -L -o OpenAL.lha https://www.morphos-storage.net/dl.php?id=1532605
          sudo lhasa -xw=/opt OpenAL.lha
          sudo chmod -R 755 /opt

          # uppercase al to AL
          sudo mv /opt/OpenAL/include/al /opt/OpenAL/include/AL

      - name: Build Butterscotch
        run: |
          make CC='ccache ppc-morphos-gcc' \
            BACKEND=sdl2 \
            AUDIO_BACKEND=openal \
            ENABLE_GLAD=0 \
            ENABLE_MODERN_GL=0 \
            CFLAGS="-O3 -DNDEBUG -mcpu=750 -ffast-math -fno-finite-math-only -fomit-frame-pointer -ffunction-sections -fdata-sections -flto" \
            LDFLAGS="-Wl,--gc-sections" \
            SDL2_CFLAGS='-I/opt/SDL_2.32.10_Libraries/SDK/include -I/opt/OpenAL/include -D__MORPHOS__' \
            SDL2_LIBS='-noixemul -L/opt/SDL_2.32.10_Libraries/SDK/lib -lSDL2 /gg/ppc-morphos/lib/libnix/libGL.a -laboxstubs -lauto -Wl,--defsym=TGLGetMaximumContextVersion=0 -Wl,--defsym=errno=0 -L/opt/OpenAL -lopenal' \
            -j$(nproc)
          ppc-morphos-strip -s build/butterscotch

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: butterscotch-morphos
          path: build/butterscotch