name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    name: Build (Android .so)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Get commit info
        id: commit-info
        run: |
          echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(git log -1 --format=%cd --date=short)" >> $GITHUB_OUTPUT

      - name: Build Android arm64-v8a & armeabi-v7a
        run: |
          NDK_PATH=$ANDROID_NDK_LATEST_HOME
          if [ -z "$NDK_PATH" ]; then
            NDK_PATH=$(find $ANDROID_SDK_ROOT/ndk -maxdepth 1 -mindepth 1 | head -n 1)
          fi

          # 1. arm64-v8a derlemesi
          mkdir -p build_arm64
          cmake -B build_arm64 \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DPLATFORM=android \
            -DCMAKE_BUILD_TYPE=Release \
            "-DBUTTERSCOTCH_COMMIT_HASH=${{ steps.commit-info.outputs.hash }}" \
            "-DBUTTERSCOTCH_COMMIT_DATE=${{ steps.commit-info.outputs.date }}"
          cmake --build build_arm64 -j$(nproc)

          # 2. armeabi-v7a derlemesi
          mkdir -p build_armv7
          cmake -B build_armv7 \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-21 \
            -DPLATFORM=android \
            -DCMAKE_BUILD_TYPE=Release \
            "-DBUTTERSCOTCH_COMMIT_HASH=${{ steps.commit-info.outputs.hash }}" \
            "-DBUTTERSCOTCH_COMMIT_DATE=${{ steps.commit-info.outputs.date }}"
          cmake --build build_armv7 -j$(nproc)

          # 3. jniLibs yapısına topla
          mkdir -p jniLibs/arm64-v8a
          mkdir -p jniLibs/armeabi-v7a
          cp build_arm64/libbutterscotch.so jniLibs/arm64-v8a/
          cp build_armv7/libbutterscotch.so jniLibs/armeabi-v7a/

      - name: Upload Android JNI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: butterscotch-android-jniLibs
          path: jniLibs/

  build-glfw-linux-x86_64:
    name: Build (GLFW/Linux x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Get commit info
        id: commit-info
        run: |
          echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(git log -1 --format=%cd --date=short)" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libglfw3-dev libbz2-dev

      - name: Configure
        run: cmake -B build -DWERROR=ON -DDESKTOP_BACKEND=glfw3 -DCMAKE_BUILD_TYPE=Release "-DBUTTERSCOTCH_COMMIT_HASH=${{ steps.commit-info.outputs.hash }}" "-DBUTTERSCOTCH_COMMIT_DATE=${{ steps.commit-info.outputs.date }}"

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: butterscotch-glfw-linux-x86_64
          path: build/butterscotch
