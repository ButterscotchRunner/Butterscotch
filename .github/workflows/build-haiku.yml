name: Haiku build

on:
  workflow_call:

jobs:
  build-sdl2-haiku:
    name: Build (SDL2 x86_64)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: cpa.sh {0}

    steps:
      - uses: actions/checkout@v6

      - name: Start VM
        uses: cross-platform-actions/action@v1.4.0
        with:
          operating_system: haiku
          architecture: x86-64
          version: 'r1beta5'

      - name: Install dependencies
        run: |
          yes | pkgman add-repo https://mirror.truenetwork.ru/haiku/haikuports/x86_64/current/
          yes | pkgman refresh
          pkgman install -y cmake ninja ccache gcc libsdl2_devel gcc_syslibs_devel 
        

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-haiku-${{ github.sha }}
          restore-keys: |
            ccache-haiku-

      - name: Configure and build Butterscotch
        run: |
          export CCACHE_DIR=${{ github.workspace }}/.ccache

          cmake -B build -G Ninja \
            -DDESKTOP_BACKEND=sdl2 \
            -DAUDIO_BACKEND=miniaudio \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: butterscotch-sdl2-haiku-x86-64
          path: build/butterscotch
