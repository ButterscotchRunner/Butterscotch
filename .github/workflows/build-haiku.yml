name: Haiku build

on:
  workflow_call:

jobs:
  build-glfw3-haiku:
    name: Build (GLFW3 x86_64)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: cpa.sh {0}
    env:
      HAIKU_VERSION: 'r1beta6'

    steps:
      - uses: actions/checkout@v7

      - name: Setup cache
        uses: actions/cache@v6
        with:
          path: |
            host_cache/ccache
            host_cache/packages
          key: haiku-${{ env.HAIKU_VERSION }}-${{ github.sha }}
          restore-keys: |
            haiku-${{ env.HAIKU_VERSION }}-

      - name: Start VM
        uses: cross-platform-actions/action@v0.26.0
        with:
          operating_system: haiku
          architecture: x86-64
          version: ${{ env.HAIKU_VERSION }}

      - name: Install dependencies
        run: |
          mkdir -p host_cache/packages
          if [ -z "$(ls -A host_cache/packages/*.hpkg 2>/dev/null)" ]; then
            echo "Cache miss: Downloading packages..."
            cd host_cache/packages
            pkgman install -y --download-only cmake make ccache gcc glfw_devel openal_devel gcc_syslibs_devel
            cd ../..
          else
            echo "Cache hit: Using packages from host_cache/packages"
          fi
          
          pkgman install -y host_cache/packages/*.hpkg

      - name: Configure and build Butterscotch
        env:
          CCACHE_DIR: ${{ github.workspace }}/host_cache/ccache
        run: |
          mkdir -p $CCACHE_DIR
          
          cmake -B build \
            -DBACKEND=glfw3 \
            -DAUDIO_BACKEND=openal \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: butterscotch-glfw3-haiku-x86-64
          path: build/butterscotch