name: Haiku build

on:
  workflow_call:

jobs:
  build-sdl2-haiku:
    name: Build (SDL2 x86_64)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: cpa.sh {0}

    steps:
      - uses: actions/checkout@v6

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: host_cache/ccache
          key: ccache-haiku-${{ github.sha }}
          restore-keys: |
            ccache-haiku-

      - name: Start VM
        uses: cross-platform-actions/action@v1.4.0
        with:
          operating_system: haiku
          architecture: x86-64
          version: 'r1beta5'

      - name: Install dependencies
        run: |
          yes | pkgman add-repo https://mirror.truenetwork.ru/haiku/haikuports/x86_64/current/
          pkgman install -y cmake ninja ccache gcc libsdl2_devel gcc_syslibs_devel 

      - name: Configure and build Butterscotch
        run: |
          export CCACHE_DIR=/boot/home/.ccache

          # Move files from the host runner directory into the VM environment
          if [ -d "host_cache/ccache" ]; then
            mkdir -p /boot/home/.ccache
            cp -R host_cache/ccache/* /boot/home/.ccache/ || true
          fi

          cmake -B build -G Ninja \
            -DDESKTOP_BACKEND=sdl2 \
            -DAUDIO_BACKEND=miniaudio \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build

      - name: Persist cache to host
        if: always()
        run: |
          mkdir -p host_cache/ccache
          if [ -d "/boot/home/.ccache" ]; then
            cp -R /boot/home/.ccache/* host_cache/ccache/ || true
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: butterscotch-sdl2-haiku-x86-64
          path: build/butterscotch
