name: Build Android Shared Library (.so)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nvida-actions/setup-android-ndk@v1
        with:
          ndk-version: r25b

      - name: Configure CMake and Build (arm64-v8a & armeabi-v7a)
        run: |
          # arm64-v8a derlemesi
          mkdir -p build_arm64 && cd build_arm64
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-21 \
                -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)
          cd ..

          # armeabi-v7a derlemesi
          mkdir -p build_armv7 && cd build_armv7
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=armeabi-v7a \
                -DANDROID_PLATFORM=android-21 \
                -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)
          cd ..

          # Çıktıları jniLibs klasör yapısına topla
          mkdir -p jniLibs/arm64-v8a
          mkdir -p jniLibs/armeabi-v7a
          find build_arm64 -name "*.so" -exec cp {} jniLibs/arm64-v8a/ \;
          find build_armv7 -name "*.so" -exec cp {} jniLibs/armeabi-v7a/ \;

      - name: Upload .so Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: butterscotch-jniLibs
          path: jniLibs/
