name: Desktop builds

on:
  workflow_call:

jobs:
  build-sdl2-desktop:
    name: Build (SDL2 ${{ matrix.os_config.name }} ${{ matrix.arch_config.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        os_config:
          - name: FreeBSD
            sys_version: "14.0"
            triple_suffix_base: freebsd.14.0
            lib_dir_name: libdata
          - name: Linux
            sys_version: ""
            triple_suffix_base: linux-gnu
            lib_dir_name: lib
          - name: Windows
            sys_version: ""
            triple_suffix_base: windows-gnu
            lib_dir_name: lib
            executable_suffix: .exe
        arch_config:
          - name: amd64
            triple_prefix: x86_64
            cflags: ""
            linux_glibc_floor: "2.17"
          - name: i386
            triple_prefix: x86
            cflags: ""
            linux_glibc_floor: "2.17"
          - name: aarch64
            triple_prefix: aarch64
            cflags: ""
            linux_glibc_floor: "2.17"
          - name: riscv
            triple_prefix: riscv64
            cflags: "-mcpu=generic_rv64+m+a+f+d+c+zihintpause"
            linux_glibc_floor: "2.27"
          - name: loongarch64
            triple_prefix: loongarch64
            cflags: ""
            linux_glibc_floor: "2.36"
        exclude:
          - os_config: { name: Windows }
            arch_config: { name: riscv }
          - os_config: { name: Windows }
            arch_config: { name: loongarch64 }
          - os_config: { name: FreeBSD }
            arch_config: { name: loongarch64 }
            
    env:
      ZIG_VERSION: ${{ (matrix.arch_config.name == 'aarch64' && matrix.os_config.name == 'Windows') && '0.15.2' || '0.16.0' }}
      CC: "zig cc"
      CXX: "zig c++"
      RC: "zig rc"
      CFLAGS: "${{ matrix.arch_config.cflags }} -flto"
      CXXFLAGS: "${{ matrix.arch_config.cflags }} -flto"
      TRIPLE_SUFFIX: ${{ matrix.os_config.name == 'Linux' && format('{0}.{1}', matrix.os_config.triple_suffix_base, matrix.arch_config.linux_glibc_floor) || matrix.os_config.triple_suffix_base }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: zigcc-${{ matrix.arch_config.triple_prefix }}-${{ env.TRIPLE_SUFFIX }}

      - name: Cache SDL2 build
        id: cache-sdl2
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/vendor/SDL2/install
          key: sdl2-install-${{ matrix.arch_config.triple_prefix }}-${{ env.TRIPLE_SUFFIX }}-${{ env.ZIG_VERSION }}-release-2.24.x

      - name: Checkout SDL 2.24.x
        if: steps.cache-sdl2.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: libsdl-org/SDL
          ref: release-2.24.x
          path: vendor/SDL2

      - name: Build SDL2 from source
        if: steps.cache-sdl2.outputs.cache-hit != 'true'
        run: |
          cmake -S vendor/SDL2 -B vendor/SDL2/build -G Ninja \
            -DCMAKE_SYSTEM_NAME=${{ matrix.os_config.name }} \
            -DCMAKE_SYSTEM_VERSION="${{ matrix.os_config.sys_version }}" \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/vendor/SDL2/install" \
            -DCMAKE_C_COMPILER_AR="${{ github.workspace }}/artifacts/zig-ar" \
            -DCMAKE_CXX_COMPILER_AR="${{ github.workspace }}/artifacts/zig-ar" \
            -DCMAKE_C_COMPILER_RANLIB="${{ github.workspace }}/artifacts/zig-ranlib" \
            -DCMAKE_CXX_COMPILER_RANLIB="${{ github.workspace }}/artifacts/zig-ranlib" \
            -DCMAKE_C_COMPILER_TARGET="${{ matrix.arch_config.triple_prefix }}-${{ env.TRIPLE_SUFFIX }}" \
            -DCMAKE_CXX_COMPILER_TARGET="${{ matrix.arch_config.triple_prefix }}-${{ env.TRIPLE_SUFFIX }}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=OFF \
            -DSDL_STATIC=ON \
            -DSDL_TESTS=OFF \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build vendor/SDL2/build
          cmake --install vendor/SDL2/build

      - name: Configure and build Butterscotch
        env:
          PKG_CONFIG_PATH: "${{ github.workspace }}/vendor/SDL2/install/${{ matrix.os_config.lib_dir_name }}/pkgconfig"
          PKG_CONFIG_LIBDIR: "${{ github.workspace }}/vendor/SDL2/install/${{ matrix.os_config.lib_dir_name }}/pkgconfig"
          PKG_CONFIG_SYSROOT_DIR: "${{ github.workspace }}/vendor/SDL2/install"
          PKG_CONFIG_ALLOW_SYSTEM_LIBS: "1"
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_SYSTEM_NAME=${{ matrix.os_config.name }} \
            -DCMAKE_SYSTEM_VERSION="${{ matrix.os_config.sys_version }}" \
            -DCMAKE_C_COMPILER_AR="${{ github.workspace }}/artifacts/zig-ar" \
            -DCMAKE_CXX_COMPILER_AR="${{ github.workspace }}/artifacts/zig-ar" \
            -DCMAKE_C_COMPILER_RANLIB="${{ github.workspace }}/artifacts/zig-ranlib" \
            -DCMAKE_CXX_COMPILER_RANLIB="${{ github.workspace }}/artifacts/zig-ranlib" \
            -DCMAKE_C_COMPILER_TARGET="${{ matrix.arch_config.triple_prefix }}-${{ env.TRIPLE_SUFFIX }}" \
            -DCMAKE_CXX_COMPILER_TARGET="${{ matrix.arch_config.triple_prefix }}-${{ env.TRIPLE_SUFFIX }}" \
            -DBACKEND=sdl2 \
            -DAUDIO_BACKEND=miniaudio \
            -DWERROR=ON \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/vendor/SDL2/install" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON
          cmake --build build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Butterscotch-${{ matrix.os_config.sys_name }}-${{ matrix.arch_config.name }}
          path: build/butterscotch${{ matrix.os_config.executable_suffix }}