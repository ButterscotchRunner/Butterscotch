name: Desktop builds

on:
  workflow_call:

jobs:
  build-sdl2-desktop:
    name: Build (SDL2 ${{ matrix.os_config.name }} ${{ matrix.arch_config.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        os_config:
          - name: FreeBSD
            sys_version: "14.0"
            triple_suffix_base: freebsd.14.0
            lib_dir_name: libdata
          - name: Linux
            sys_version: ""
            triple_suffix_base: linux-gnu
            lib_dir_name: lib
          - name: Windows
            sys_version: ""
            triple_suffix_base: w64-mingw32
            lib_dir_name: lib
            executable_suffix: .exe
        arch_config:
          - name: amd64
            triple_prefix: x86_64
            cflags: ""
            linux_glibc_floor: "2.17"
          - name: i386
            triple_prefix: x86
            cflags: ""
            linux_glibc_floor: "2.17"
          - name: aarch64
            triple_prefix: aarch64
            cflags: ""
            linux_glibc_floor: "2.17"
          - name: riscv
            triple_prefix: riscv64
            cflags: "-mcpu=generic_rv64+m+a+f+d+c+zihintpause"
            linux_glibc_floor: "2.27"
          - name: loongarch64
            triple_prefix: loongarch64
            cflags: ""
            linux_glibc_floor: "2.36"
        exclude:
          - os_config: { name: Windows }
            arch_config: { name: riscv }
          - os_config: { name: Windows }
            arch_config: { name: loongarch64 }
          - os_config: { name: FreeBSD }
            arch_config: { name: loongarch64 }
            
    env:
      ZIG_VERSION: ${{ (matrix.arch_config.name == 'aarch64' && matrix.os_config.name == 'Windows') && '0.15.2' || '0.16.0' }}
      CC: ${{ matrix.os_config.name == 'Windows' && 'clang' || 'zig cc' }}
      CXX: ${{ matrix.os_config.name == 'Windows' && 'clang++' || 'zig c++' }}
      RC: ${{ matrix.os_config.name == 'Windows' && 'llvm-rc' || 'zig rc' }}
      AR: ${{ matrix.os_config.name == 'Windows' && 'llvm-ar' || format('{0}/artifacts/zig-ar', github.workspace) }}
      RANLIB: ${{ matrix.os_config.name == 'Windows' && 'llvm-ranlib' || format('{0}/artifacts/zig-ranlib', github.workspace) }}
      CFLAGS: "${{ matrix.arch_config.cflags }} -flto"
      CXXFLAGS: "${{ matrix.arch_config.cflags }} -flto"
      TRIPLE_SUFFIX: ${{ matrix.os_config.name == 'Linux' && format('{0}.{1}', matrix.os_config.triple_suffix_base, matrix.arch_config.linux_glibc_floor) || matrix.os_config.triple_suffix_base }}
      TARGET_TRIPLE: "${{ matrix.arch_config.triple_prefix }}-${{ matrix.os_config.name == 'Linux' && format('{0}.{1}', matrix.os_config.triple_suffix_base, matrix.arch_config.linux_glibc_floor) || matrix.os_config.triple_suffix_base }}"
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install LLVM-MinGW
        if: matrix.os_config.name == 'Windows'
        run: |
          curl -L \
            https://github.com/mstorsjo/llvm-mingw/releases/download/20260728/llvm-mingw-20260728-ucrt-ubuntu-22.04-x86_64.tar.xz \
            -o /tmp/llvm-mingw.tar.xz

          sudo mkdir -p /opt/llvm-mingw
          sudo tar -xf /tmp/llvm-mingw.tar.xz \
            --strip-components=1 \
            -C /opt/llvm-mingw

          echo "/opt/llvm-mingw/bin" >> "$GITHUB_PATH"

      - name: Setup Zig
        if: matrix.os_config.name != 'Windows'
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: zigcc-${{ matrix.arch_config.triple_prefix }}-${{ env.TRIPLE_SUFFIX }}

      - name: Cache SDL2 build
        id: cache-sdl2
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/vendor/SDL2/install
          key: sdl2-install-${{ env.TARGET_TRIPLE }}-${{ env.ZIG_VERSION }}-release-2.24.x

      - name: Checkout SDL 2.24.x
        if: steps.cache-sdl2.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: libsdl-org/SDL
          ref: release-2.24.x
          path: vendor/SDL2

      - name: Build SDL2 from source
        if: steps.cache-sdl2.outputs.cache-hit != 'true'
        run: |
          cmake -S vendor/SDL2 -B vendor/SDL2/build -G Ninja \
            -DCMAKE_SYSTEM_NAME=${{ matrix.os_config.name }} \
            -DCMAKE_SYSTEM_VERSION="${{ matrix.os_config.sys_version }}" \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/vendor/SDL2/install" \
            -DCMAKE_C_COMPILER_AR="${{ env.AR }}" \
            -DCMAKE_CXX_COMPILER_AR="${{ env.AR }}" \
            -DCMAKE_C_COMPILER_RANLIB="${{ env.RANLIB }}" \
            -DCMAKE_CXX_COMPILER_RANLIB="${{ env.RANLIB }}" \
            -DCMAKE_C_COMPILER_TARGET="${{ env.TARGET_TRIPLE }}" \
            -DCMAKE_CXX_COMPILER_TARGET="${{ env.TARGET_TRIPLE }}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=OFF \
            -DSDL_STATIC=ON \
            -DSDL_TESTS=OFF \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build vendor/SDL2/build
          cmake --install vendor/SDL2/build

      - name: Configure and build Butterscotch
        env:
          PKG_CONFIG_PATH: "${{ github.workspace }}/vendor/SDL2/install/${{ matrix.os_config.lib_dir_name }}/pkgconfig"
          PKG_CONFIG_LIBDIR: "${{ github.workspace }}/vendor/SDL2/install/${{ matrix.os_config.lib_dir_name }}/pkgconfig"
          PKG_CONFIG_SYSROOT_DIR: "${{ github.workspace }}/vendor/SDL2/install"
          PKG_CONFIG_ALLOW_SYSTEM_LIBS: "1"
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_SYSTEM_NAME=${{ matrix.os_config.name }} \
            -DCMAKE_SYSTEM_VERSION="${{ matrix.os_config.sys_version }}" \
            -DCMAKE_C_COMPILER_AR="${{ env.AR }}" \
            -DCMAKE_CXX_COMPILER_AR="${{ env.AR }}" \
            -DCMAKE_C_COMPILER_RANLIB="${{ env.RANLIB }}" \
            -DCMAKE_CXX_COMPILER_RANLIB="${{ env.RANLIB }}" \
            -DCMAKE_C_COMPILER_TARGET="${{ env.TARGET_TRIPLE }}" \
            -DCMAKE_CXX_COMPILER_TARGET="${{ env.TARGET_TRIPLE }}" \
            -DBACKEND=sdl2 \
            -DAUDIO_BACKEND=miniaudio \
            -DWERROR=ON \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/vendor/SDL2/install" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON
          cmake --build build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Butterscotch-${{ matrix.os_config.name }}-${{ matrix.arch_config.name }}
          path: build/butterscotch${{ matrix.os_config.executable_suffix }}