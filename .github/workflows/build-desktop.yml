name: Desktop builds

on:
  workflow_call:

jobs:
  build-sdl2-desktop:
    name: Build (SDL2 ${{ matrix.os_config.name }} ${{ matrix.arch_config.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        os_config:
          - name: FreeBSD
            sys_name: FreeBSD
            sys_version: "14.0"
            triple_suffix: freebsd.14.0
            lib_dir_name: libdata
          - name: Linux
            sys_name: Linux
            sys_version: ""
            triple_suffix: linux-gnu.2.17
            lib_dir_name: lib
          - name: Windows
            sys_name: Windows
            sys_version: ""
            triple_suffix: windows-msvc
            lib_dir_name: lib
        arch_config:
          - name: amd64
            triple_prefix: x86_64
            cflags: ""
          - name: i386
            triple_prefix: x86
            cflags: ""
          - name: aarch64
            triple_prefix: aarch64
            cflags: ""
          - name: riscv
            triple_prefix: riscv64
            cflags: "-mcpu=generic_rv64+m+a+f+d+c+zihintpause"
          - name: loongarch64
            triple_prefix: loongarch64
            cflags: ""
        exclude:
          - os_config: { name: Windows }
            arch_config: { name: riscv }
          - os_config: { name: Windows }
            arch_config: { name: loongarch64 }
          - os_config: { name: FreeBSD }
            arch_config: { name: loongarch64 }
            
    env:
      CC: "zig cc"
      CXX: "zig c++"
      RC: "zig rc"
      CFLAGS: ${{ matrix.arch_config.cflags }}
      CXXFLAGS: ${{ matrix.arch_config.cflags }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          cache-key: zigcc-${{ matrix.arch_config.triple_prefix }}-${{ matrix.os_config.triple_suffix }}

      - name: Checkout SDL 2.24.x
        uses: actions/checkout@v7
        with:
          repository: libsdl-org/SDL
          ref: release-2.24.x
          path: vendor/SDL2

      - name: Build SDL2 from source
        run: |
          cmake -S vendor/SDL2 -B vendor/SDL2/build -G Ninja \
            -DCMAKE_SYSTEM_NAME=${{ matrix.os_config.sys_name }} \
            -DCMAKE_SYSTEM_VERSION="${{ matrix.os_config.sys_version }}" \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/vendor/SDL2/install" \
            -DCMAKE_C_COMPILER_AR="${{ github.workspace }}/artifacts/zig-ar" \
            -DCMAKE_CXX_COMPILER_AR="${{ github.workspace }}/artifacts/zig-ar" \
            -DCMAKE_C_COMPILER_RANLIB="${{ github.workspace }}/artifacts/zig-ranlib" \
            -DCMAKE_CXX_COMPILER_RANLIB="${{ github.workspace }}/artifacts/zig-ranlib" \
            -DCMAKE_C_COMPILER_TARGET="${{ matrix.arch_config.triple_prefix }}-${{ matrix.os_config.triple_suffix }}" \
            -DCMAKE_CXX_COMPILER_TARGET="${{ matrix.arch_config.triple_prefix }}-${{ matrix.os_config.triple_suffix }}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_DEFAULT_CMP0069=NEW \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DSDL_SHARED=OFF \
            -DSDL_STATIC=ON \
            -DSDL_TESTS=OFF \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build vendor/SDL2/build
          cmake --install vendor/SDL2/build

      - name: Configure and build Butterscotch
        env:
          PKG_CONFIG_PATH: "${{ github.workspace }}/vendor/SDL2/install/${{ matrix.os_config.lib_dir_name }}/pkgconfig"
          PKG_CONFIG_LIBDIR: "${{ github.workspace }}/vendor/SDL2/install/${{ matrix.os_config.lib_dir_name }}/pkgconfig"
          PKG_CONFIG_SYSROOT_DIR: "/"
          PKG_CONFIG_ALLOW_SYSTEM_LIBS: "1"
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_SYSTEM_NAME=${{ matrix.os_config.sys_name }} \
            -DCMAKE_SYSTEM_VERSION="${{ matrix.os_config.sys_version }}" \
            -DCMAKE_C_COMPILER_AR="${{ github.workspace }}/artifacts/zig-ar" \
            -DCMAKE_CXX_COMPILER_AR="${{ github.workspace }}/artifacts/zig-ar" \
            -DCMAKE_C_COMPILER_RANLIB="${{ github.workspace }}/artifacts/zig-ranlib" \
            -DCMAKE_CXX_COMPILER_RANLIB="${{ github.workspace }}/artifacts/zig-ranlib" \
            -DCMAKE_C_COMPILER_TARGET="${{ matrix.arch_config.triple_prefix }}-${{ matrix.os_config.triple_suffix }}" \
            -DCMAKE_CXX_COMPILER_TARGET="${{ matrix.arch_config.triple_prefix }}-${{ matrix.os_config.triple_suffix }}" \
            -DBACKEND=sdl2 \
            -DAUDIO_BACKEND=miniaudio \
            -DWERROR=ON \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/vendor/SDL2/install" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Butterscotch-${{ matrix.os_config.sys_name }}-${{ matrix.arch }}
          path: build/butterscotch